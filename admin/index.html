<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin | JS Supersonic</title>
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Staff area for managing the JS Supersonic shop.">
<meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="preload" href="../assets/fonts/archivo-var.woff" as="font" type="font/woff" crossorigin>
<link rel="stylesheet" href="admin.css">
<script>!function(l){if(l.protocol==='http:'&&!/^(localhost|127\.|0\.0|192\.168\.)/.test(l.hostname))l.replace('https:'+l.href.slice(5))}(location)</script>
</head>
<body>
<div id="gate" class="gate" hidden>
  <div class="gate-art"><p style="font-weight:800;font-stretch:118%;color:#fff;letter-spacing:.04em">JS SUPERSONIC</p><h1 class="disp">Shop admin</h1><p>Products, orders, customers, promo codes and store settings in one place.</p></div>
  <div class="gate-form"><form id="gate-form" novalidate>
    <h2 id="gate-title">Sign in</h2>
    <p class="note" id="gate-note">Enter the admin password.</p>
    <label class="f">Password<input class="in" type="password" id="pw" autocomplete="current-password" required minlength="8"></label>
    <label class="f" id="pw2-row" hidden>Type it again<input class="in" type="password" id="pw2" autocomplete="new-password" minlength="8"></label>
    <p class="err" id="gate-err" role="alert"></p>
    <button class="btn" type="submit" id="gate-btn">Sign in</button>
    <a href="../index.html" style="font-size:14px;color:var(--muted)">Back to the shop</a>
  </form></div>
</div>

<div id="app" class="app" hidden>
  <aside class="side" id="side" aria-label="Admin navigation">
    <a class="brand" href="#/dashboard"><b><span>JS</span></b><span class="t">Supersonic<small>Admin</small></span></a>
    <nav id="nav">
      <span class="hl" aria-hidden="true"></span>
      <a href="#/dashboard" data-v="dashboard"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="square"><path d="M4 4h7v9H4zM13 4h7v5h-7zM13 11h7v9h-7zM4 15h7v5H4z"/></svg>Dashboard</a>
      <a href="#/products" data-v="products"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="square"><path d="M3 7l9-4 9 4v10l-9 4-9-4zM3 7l9 4 9-4M12 11v10"/></svg>Products</a>
      <a href="#/orders" data-v="orders"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="square"><path d="M5 8h14l-1 13H6zM9 8V6a3 3 0 0 1 6 0v2"/></svg>Orders<span class="n" id="n-orders" hidden></span></a>
      <a href="#/customers" data-v="customers"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="square"><circle cx="9" cy="8" r="4"/><path d="M2 21c.6-4 3.4-6 7-6s6.4 2 7 6M16 4a4 4 0 0 1 0 8M18 15c2 .7 3.5 2.6 4 6"/></svg>Customers</a>
      <a href="#/messages" data-v="messages"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="square"><path d="M3 5h18v14H3z"/><path d="m3 6 9 7 9-7"/></svg>Messages<span class="n" id="n-msgs" hidden></span></a>
      <a href="#/promotions" data-v="promotions"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="square"><path d="M3 3h8l10 10-8 8L3 11z"/><circle cx="7.5" cy="7.5" r="1.5"/></svg>Promotions</a>
      <a href="#/settings" data-v="settings"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="square"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/></svg>Settings</a>
    </nav>
    <div class="foot">
      <a href="../index.html" target="_blank" rel="noopener"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="square"><path d="M14 4h6v6M20 4l-9 9M18 14v6H4V6h6"/></svg>View the shop</a>
      <button type="button" id="logout"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="square"><path d="M10 4H4v16h6M16 8l4 4-4 4M20 12H9"/></svg>Sign out</button>
    </div>
  </aside>
  <div class="main">
    <header class="top"><button class="icon-btn menu-btn" type="button" id="menu-btn" aria-label="Open navigation"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M3 6h18M3 12h18M3 18h12"/></svg></button>
      <h1 id="v-title">Dashboard</h1><div class="acts" id="v-acts"></div></header>
    <main class="view" id="view" tabindex="-1"></main>
  </div>
</div>

<div class="scrim" id="scrim"></div>
<aside class="panel" id="panel" aria-hidden="true" aria-labelledby="panel-t">
  <div class="panel-h"><h2 id="panel-t"></h2><button class="icon-btn" type="button" data-close aria-label="Close"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
  <div class="panel-b" id="panel-b"></div>
  <div class="panel-f" id="panel-f"></div>
</aside>
<dialog id="confirm"><h2 id="c-t"></h2><p id="c-m"></p><div class="r"><button class="btn line" value="no" type="button" id="c-no">Cancel</button><button class="btn danger" type="button" id="c-yes">Delete</button></div></dialog>
<div class="toasts" role="status" aria-live="polite"></div>
<input type="file" id="import" accept="application/json,.json" hidden>

<script src="../assets/js/catalog.js"></script>
<script src="admin.js"></script>
</body>
</html>
